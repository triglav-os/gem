# Build and publish GEM runtime packages for version tags such as v1.2.3.
# SPDX-License-Identifier: GPL-2.0-or-later
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version X.Y.Z (creates tag vX.Y.Z on the selected commit).
          Leave empty to build workflow artifacts without publishing a release.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rasta viewer backend: includes rasta and librasta.
          - variant: hosted
            platform: rasta
          # Linux framebuffer/evdev backend: no Rasta.
          - variant: native
            platform: linux
    env:
      BUILD_DIR: ${{ github.workspace }}/build/release-${{ matrix.platform }}
      OUTPUT_ROOT: ${{ github.workspace }}/build/release-${{ matrix.platform }}/out
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Determine version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
              version="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
              version="${INPUT_VERSION#v}"
          else
              version="dev-${GITHUB_SHA::8}"
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] || [ -n "$INPUT_VERSION" ]; then
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
                  { echo "Version must be X.Y.Z, got '$version'" >&2; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE"

      - name: Configure
        run: |
          tools/scripts/container.sh exec cmake -S . -B "$BUILD_DIR" \
              -DCMAKE_BUILD_TYPE=Release \
              -DGEM_PLATFORM=${{ matrix.platform }} \
              -DBUILD_TESTING=OFF \
              -DGEM_OUTPUT_ROOT="$OUTPUT_ROOT"

      - name: Build and stage runtime package
        run: |
          tools/scripts/container.sh exec cmake --build "$BUILD_DIR" \
              --target gemix_package --parallel "$(nproc)"

      - name: Verify package contents
        run: |
          root="$OUTPUT_ROOT/gemix"
          for program in gemd desktop terminal calc ted clock stout gemread gemscape; do
              test -x "$root/bin/$program" || { echo "Missing bin/$program" >&2; exit 1; }
          done
          for library in libgem.so libaes.so libvdi.so; do
              test -f "$root/lib/$library" || { echo "Missing lib/$library" >&2; exit 1; }
          done
          if [ "${{ matrix.platform }}" = rasta ]; then
              test -x "$root/bin/rasta" || { echo 'Missing bin/rasta' >&2; exit 1; }
          else
              test ! -e "$root/bin/rasta" || { echo 'Native package contains rasta' >&2; exit 1; }
          fi

      - name: Create archive
        id: archive
        run: |
          name="gem-${VERSION}-linux-x86_64-${{ matrix.variant }}"
          mkdir -p dist
          tar -C "$OUTPUT_ROOT" --owner=0 --group=0 --numeric-owner \
              --transform "s,^gemix,${name},S" -czf "dist/${name}.tar.gz" gemix
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: dist/${{ steps.archive.outputs.name }}.tar.gz
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
              tag="$GITHUB_REF_NAME"
              target=(--verify-tag)
          else
              # Manual run: gh creates the tag on the commit that was built.
              tag="v${INPUT_VERSION#v}"
              target=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "GEM for Linux ${tag}" \
              --generate-notes \
              "${target[@]}"
